<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="MyNinho">
  <defs>
    <linearGradient id="nestBg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A8A74"/>
      <stop offset="1" stop-color="#2F6F5E"/>
    </linearGradient>
    <linearGradient id="eggShine" x1="28" y1="22" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0D48A"/>
      <stop offset="1" stop-color="#D4A84B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#nestBg)"/>
  <!-- soft leaf glow -->
  <circle cx="20" cy="18" r="14" fill="#FFFFFF" fill-opacity="0.08"/>
  <!-- nest bowl -->
  <path d="M14 42c4.5-11 11.5-17.5 18-19.5 6.5 2 13.5 8.5 18 19.5-6.5 4.5-11.5 6.5-18 6.5S20.5 46.5 14 42Z" fill="#F4FBF7"/>
  <path d="M18 40.5c3.5-8 9-13 14-14.5 5 1.5 10.5 6.5 14 14.5" stroke="#2F6F5E" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
  <!-- egg -->
  <ellipse cx="32" cy="29.5" rx="6.2" ry="7.4" fill="url(#eggShine)"/>
  <ellipse cx="29.8" cy="26.8" rx="2.1" ry="2.8" fill="#FFFFFF" fill-opacity="0.35"/>
  <!-- coral accent speck -->
  <circle cx="46" cy="18" r="2.2" fill="#D4846A" fill-opacity="0.9"/>
</svg>
